<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book a Test Ride</title>
<meta name="description" content="Save over ₦4m in 5 years with our original electric bike. Join our WhatsApp group to book a test ride.">
<meta name="theme-color" content="#0B0B0B">
<meta property="og:title" content="Book a test ride">
<meta property="og:description" content="Save over ₦4m in 5 years with our original electric bike with lithium ion battery that can go up to 100km in 1 full charge">
<meta property="og:image" content="img/bike.jpg">
<link rel="preload" href="fonts/big-shoulders-display.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="img/bike.jpg" as="image" media="(max-width:899px), (max-aspect-ratio:1/1)">
<style>
@font-face{font-family:"Big Shoulders Display";src:url(fonts/big-shoulders-display.woff2) format("woff2");font-weight:700 900;font-display:swap}
:root{--ink:#0B0B0B;--hi:#FFD60A;--white:#fff;--wa:#25D366;
  /* one scale unit: tracks width on phones, height when the viewport is short */
  --u:min(1vw,.56vh)}
@supports (height:1dvh){:root{--u:min(1vw,.56dvh)}}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--ink);color:var(--white)}
body{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.page{position:relative;height:100vh;height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;
  padding:calc(var(--u)*8 + env(safe-area-inset-top)) 16px calc(var(--u)*6 + env(safe-area-inset-bottom))}

/* full-bleed bike: grain + dark scrim, as in the Number Board ad */
.photo{position:absolute;inset:0;z-index:0}
.photo img{width:100%;height:100%;object-fit:cover;object-position:62% 72%;display:block;
  filter:contrast(1.2) saturate(.6) brightness(.8) sepia(.15)}
.photo::before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(11,11,11,.85) 0%,rgba(11,11,11,.5) 36%,rgba(11,11,11,0) 54%,rgba(11,11,11,.1) 68%,rgba(11,11,11,.88) 100%)}
.photo::after{content:"";position:absolute;inset:0;z-index:2;opacity:.2;mix-blend-mode:overlay;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' seed='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}

h1,.act{position:relative;z-index:3;width:100%}
h1{font-weight:800;text-transform:uppercase;line-height:1}
/* headline on one line: SAVE OVER [₦4m IN 5 YEARS] */
/* --k scales the whole lockup; .72 makes it fit a 360px phone on one line */
h1 .row{--k:calc(var(--u)*.745);display:flex;justify-content:center;white-space:nowrap}
h1 .lead{font-size:calc(var(--k)*9.4);line-height:.86;margin-right:calc(var(--k)*2)}
h1 .plate{display:inline-flex;align-items:flex-end;background:var(--hi);color:var(--ink);font-weight:900;
  padding:calc(var(--k)*1.8) calc(var(--k)*2.6) calc(var(--k)*1) calc(var(--k)*2.4)}
h1 .big{font-size:calc(var(--k)*21);line-height:.8;letter-spacing:-.02em;text-transform:none}
h1 .small{font-size:calc(var(--k)*9.4);line-height:.86;margin-left:calc(var(--k)*1.8)}
h1 .strip{display:block;margin:calc(var(--u)*5) auto 0;max-width:calc(var(--u)*92)}
h1 .strip span{background:var(--ink);color:var(--white);font-size:calc(var(--u)*7.4);font-weight:800;line-height:1.32;
  padding:calc(var(--u)*.3) calc(var(--u)*2.2);-webkit-box-decoration-break:clone;box-decoration-break:clone}
h1 em{font-style:normal;color:var(--hi)}

.act{display:flex;flex-direction:column;align-items:center}
.cta{display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*3);width:100%;max-width:calc(var(--u)*92);min-height:48px;
  background:var(--wa);color:var(--ink);text-decoration:none;text-transform:uppercase;font-weight:900;text-align:left;
  font-size:calc(var(--u)*7.4);line-height:1;padding:calc(var(--u)*4) calc(var(--u)*4)}
.cta span{text-wrap:balance}
.cta .arrow{width:calc(var(--u)*7);height:calc(var(--u)*7);color:var(--ink);margin-left:auto}
.cta svg{flex:none;width:calc(var(--u)*11);height:calc(var(--u)*11);color:var(--white)}
.cta:active{background:var(--white)}
.cta:focus-visible{outline:3px solid var(--white);outline-offset:3px}
.count{display:inline-block;margin-top:calc(var(--u)*3);background:var(--ink);color:var(--white);
  font-size:calc(var(--u)*6);font-weight:800;text-transform:uppercase;letter-spacing:.02em;padding:calc(var(--u)*.8) calc(var(--u)*2.2)}
.count b{color:var(--hi);font-weight:900}
.count[hidden]{display:none}

/* desktop: same board, centred over a landscape crop of the bike */
@media (min-width:900px) and (min-aspect-ratio:1/1){
  :root{--u:min(.5vw,.8vh)}
  @supports (height:1dvh){:root{--u:min(.5vw,.8dvh)}}
  .page{justify-content:center;gap:calc(var(--u)*11);padding:48px}
  .photo img{object-position:50% 55%}
  .photo::before{background:radial-gradient(ellipse at 50% 50%,rgba(11,11,11,.55) 0%,rgba(11,11,11,.72) 55%,rgba(11,11,11,.9) 100%)}
  h1 .row{--k:var(--u)}
  h1 .strip{max-width:calc(var(--u)*160)}
  .cta{width:auto;max-width:none;font-size:calc(var(--u)*6.4);padding:calc(var(--u)*3.4) calc(var(--u)*6)}
  .cta svg{width:calc(var(--u)*9.5);height:calc(var(--u)*9.5)}
  .cta .arrow{width:calc(var(--u)*7);height:calc(var(--u)*7);margin-left:calc(var(--u)*1)}
}
</style>
</head>
<body>
<main class="page">
  <picture class="photo">
    <source media="(min-width:900px) and (min-aspect-ratio:1/1)" srcset="img/bike-wide.jpg" width="1216" height="1000">
    <img src="img/bike.jpg" alt="Two black electric bikes parked on cardboard outside our shop" width="720" height="1018" fetchpriority="high">
  </picture>

  <h1>
    <span class="row"><span class="plate"><span class="lead">Save over</span> <span class="big">₦4m</span> <span class="small">in 5 years</span></span></span>
    <span class="strip"><span>with our original electric bike with lithium ion battery that can go up to <em>100km</em> in 1 full charge</span></span>
  </h1>

  <div class="act">
    <a class="cta" id="cta" href="https://chat.whatsapp.com/LCAzwJiTjyR0hle8yjyfjm" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      <span>Join our WhatsApp group to book a test ride</span>
      <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5h12.2l-4.6-4.6 2.1-2.1L21 12l-8.3 8.2-2.1-2.1 4.6-4.6H3z" fill="currentColor"/></svg>
    </a>
    <p class="count" id="count" role="status" aria-live="polite" hidden>Taking you to WhatsApp in <b id="n">10</b>…</p>
  </div>
</main>

<script>
(function(){
  var LINK = "https://chat.whatsapp.com/LCAzwJiTjyR0hle8yjyfjm";
  var SECONDS = 10, KEY = "wa-auto-redirected";
  // Set to false to pause the auto-redirect (e.g. while reviewing).
  var AUTO_REDIRECT = true;
  var count = document.getElementById("count"), num = document.getElementById("n");
  var timer = null, deadline = 0, over = false;

  function remember(){ try { sessionStorage.setItem(KEY, "1"); } catch(e){} }
  function already(){ try { return sessionStorage.getItem(KEY) === "1"; } catch(e){ return false; } }

  function stop(){
    if (over) return;
    over = true;
    clearInterval(timer);
    count.hidden = true;
    off();
  }

  function tick(){
    var left = Math.ceil((deadline - Date.now()) / 1000);
    if (left <= 0){
      over = true; clearInterval(timer); off(); remember();
      window.location.href = LINK;
      return;
    }
    num.textContent = left;
  }

  function start(){
    if (over || timer) return;
    count.hidden = false;
    deadline = Date.now() + SECONDS * 1000;
    timer = setInterval(tick, 200);
  }

  var events = ["pointerdown", "touchstart", "wheel", "keydown", "scroll"];
  function onVis(){ if (document.visibilityState === "hidden") stop(); }
  function on(){
    events.forEach(function(e){ window.addEventListener(e, stop, {capture:true, passive:true}); });
    document.addEventListener("scroll", stop, {capture:true, passive:true});
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", stop);
  }
  function off(){
    events.forEach(function(e){ window.removeEventListener(e, stop, {capture:true}); });
    document.removeEventListener("scroll", stop, {capture:true});
    document.removeEventListener("visibilitychange", onVis);
    window.removeEventListener("pagehide", stop);
  }

  document.getElementById("cta").addEventListener("click", remember);
  // Coming back from WhatsApp (back button / bfcache): never jump again.
  window.addEventListener("pageshow", function(e){ if (e.persisted) stop(); });

  // Review mode: show the countdown strip frozen so the layout matches live, but never jump.
  if (!AUTO_REDIRECT) { over = true; num.textContent = SECONDS; count.hidden = false; return; }
  if (already()) { over = true; return; }
  on();
  if (document.visibilityState === "visible") start();
  else document.addEventListener("visibilitychange", function v(){
    if (document.visibilityState === "visible" && !over){ document.removeEventListener("visibilitychange", v); start(); }
  });
})();
</script>
</body>
</html>
